<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/inicioSesion.css">
    <script src="assets/js/inicioSesion.js"></script>
    <script src="assets/js/cuentas.js"></script>
</head>


<body>
    

    <header>
        <img src="assets/img/logoForfols.png" alt="logo de forfols">
        <img src="assets/img/logoITI.png" alt="logo de la ITI">
    </header>

    <section class="inicioSesion">
    <h1>Iniciar Sesión</h1>
    
    <form id="inicioSesion">

    <label for="ci">Cédula:</label>
    <input type="text" id="ci" name="ci" required>
    <br>
    <label for="contra">Contraseña:</label>
    <input type="password" id="contra" name="contra" required>
    <br>

    <button type="submit" class="btn btn-outline-danger">Iniciar sesión</button>
    </section>

    </form>

</body>

</html>
