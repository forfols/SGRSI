<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/solicitante.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center">
            <a href="indexSolicitante.html"><button class="btnNav">Terminar</button></a>
            <button class="btnNav" id="btnCerrarSesion">Cerrar sesión</button>
        </nav>
    </header>

    <div id="alerta"></div>

    <form id="registroIncidencia" class="mt-3">
        <fieldset>
            <legend>Registrar Incidencia</legend>

            <div class="mb-2">
                <label for="tipo">Tipo de Incidencia:</label>
                <select name="tipo" id="tipo" required>
                    <option value="" disabled selected hidden>--</option>
                    <option>Otros</option>
                    <option>PC</option>
                </select>
            </div>

            <div id="campoExtra" class="d-none">
                <label for="nroPc">PC:</label>
                <select name="nroPc" id="nroPc"></select>

                <label for="nombreAlumno">Persona asignada:</label>
                <input name="nombreAlumno" id="nombreAlumno" type="text" placeholder="Ej: Juan Perez">
            </div>

            <div class="mb-2">
                <h4>Descripción de la Incidencia</h4>
                <textarea cols="40" rows="10" id="descripcion" name="descripcion" required placeholder="Describe la incidencia..."></textarea>
            </div>

            <input type="submit" value="Registrar Incidencia" class="mt-2">
        </fieldset>
    </form>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/solicitanteRegistroIncidencia.js"></script>
</body>
</html>
