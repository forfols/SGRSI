<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/solicitante.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center">
            <a href="indexSolicitante.html"><button class="btnNav">Volver</button></a>
            <button class="btnNav" id="btnCerrarSesion">Cerrar sesión</button>
        </nav>
    </header>

    <div id="alerta"></div>

    <form id="registroSolicitud" class="mt-3">
        <fieldset>
            <legend>Registrar Solicitud de servicio</legend>

            <div class="mb-2">
                <label for="tipoServicio">Seleccionar tipo de servicio:</label>
                <select name="tipoServicio" id="tipoServicio" required>
                    <option>Preparación de laboratorio</option>
                    <option>Instalación de software</option>
                    <option>Configuración de equipos</option>
                </select>
            </div>

            <label for="tipoEspacio">Espacio:</label>
            <select id="tipoEspacio" name="tipoEspacio" required>
                <option value="">Seleccione un tipo</option>
                <option value="Laboratorio">Laboratorio</option>
                <option value="Taller">Taller</option>
                <option value="Teórico">Teórico</option>
            </select>

            <label for="nroEspacio">Número del espacio:</label>
            <select id="nroEspacio" name="nroEspacio" required></select>

            <div class="mb-2">
                <label for="grupo">Grupo:</label>
                <select id="grupo" name="grupo" required>
                    <option value="">Seleccione un grupo</option>
                </select>
            </div>

            <div class="mb-2">
                <label for="fecha">Selecciona una fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="mb-2">
                <h4>Descripción del Servicio</h4>
                <textarea cols="40" rows="10" id="descripcion" name="descripcion" placeholder="Describe el servicio..." required></textarea>
            </div>

            <button type="submit" id="btnEnviar" class="mt-2">Enviar</button>
        </fieldset>
    </form>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/solicitanteRegistroSolicitud.js"></script>
</body>
</html>
