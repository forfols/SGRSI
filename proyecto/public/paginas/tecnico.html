<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/tecnico.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center">
            <a href="indexTecnico.html"><button class="btnNav">Volver</button></a>
            <button class="btnNav" id="btnCerrarSesion">Cerrar sesión</button>
        </nav>
    </header>

    <div id="alerta"></div>

    <h1>Lista de Incidencias</h1>

        <div class="btn-Filtrar">
    <button class="btn btn-danger dropdown-toggle" type="button" id="btn-filtrar" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
        Filtrar
    </button>
        <ul class="dropdown-menu p-2" aria-labelledby="btn-filtrar">
            
            <li>
                <button class="dropdown-item d-flex justify-content-between align-items-center"
                        type="button" data-bs-toggle="collapse" data-bs-target="#grupoEstado"
                        aria-expanded="true">
                    Estado <span>▾</span>
                </button>

                <div class="collapse" id="grupoEstado">
                    <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="ePendiente">Pendiente</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="estado" value="Pendiente" id="ePendiente">
                    </div>
                    <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="eProceso">En proceso</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="estado" value="En proceso" id="eProceso">
                    </div>
                    <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="eTerminado">Terminado</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="estado" value="Terminado" id="eTerminado">
                    </div>
                </div>
            </li>
            <li>
                <button class="dropdown-item d-flex justify-content-between align-items-center"
                        type="button" data-bs-toggle="collapse" data-bs-target="#grupoTipo"
                        aria-expanded="true">
                    Tipo Incidencia <span>▾</span>
                </button>

                <div class="collapse" id="grupoTipo">
                    <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="tPC">PC</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="tipo" value="PC" id="tPC">
                    </div>
                    <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="tOtros">Otros</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="tipo" value="Otros" id="tOtros">
                    </div>
                </li>
            </ul>
    </div>

    <div class="table-responsive">
        <table border="1">
            <thead>
                <tr>
                    <th>Docente</th>
                    <th>Tipo incidencia</th>
                    <th>Incidencia general</th>
                    <th>Número de PC</th>
                    <th>Alumno asignado</th>
                    <th>Espacio</th>
                    <th>Nro espacio</th>
                    <th>Grupo</th>
                    <th>Estado</th>
                    <th>Descripción</th>
                    <th>Fecha creado</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <form id="modificarEstado">
        <fieldset class="formularioModificarEstado" style="display:none">
            <legend><h2>Modificar Estado</h2></legend>

            <button type="button" id="btnCerrarModificarEstado">x</button>
            <br>

            <label for="estado">Estado:</label>
            <select id="estado" required>
                <option>Pendiente</option>
                <option>En proceso</option>
                <option>Terminado</option>
            </select>
            <br>
            <label for="prioridad">Nivel de prioridad:</label>
            <select id="prioridad" required>
                <option>Alto</option>
                <option>Medio</option>
                <option>Bajo</option>
            </select>

            <div>
                <h4>Diagnóstico</h4>
                <textarea cols="40" rows="10" id="diagnostico" required placeholder="Describe el diagnostico..."></textarea>
            </div>

            <div id="campoExtra" class="d-none">
                <h4>Soluciones</h4>
                <textarea cols="40" rows="10" id="soluciones" placeholder="Describe las soluciones..."></textarea>
            </div>

            <p><input type="submit" value="Actualizar"></p>
        </fieldset>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/tecnico.js"></script>
</body>
</html>
