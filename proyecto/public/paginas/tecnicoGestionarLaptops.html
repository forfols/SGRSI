<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar ceibal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/tecnico.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center">
            <a href="indexTecnico.html"><button class="btnNav">Volver</button></a>
            <button class="btnNav" id="btnCerrarSesion">Cerrar sesión</button>
        </nav>
    </header>

    <div id="alerta"></div>

    <form id="altaLaptop" class="mt-3">
        <fieldset>
            <legend>Agregar ceibal</legend>

            <div class="mb-2">
                <label for="modelo">Nombre:</label>
                <input type="text" id="modelo" name="modelo" placeholder="Ej: ceibal11" maxlength="255" required>
            </div>

            <input type="submit" value="Agregar" class="mt-2">
        </fieldset>
    </form>

    <h1>Lista de ceibal</h1>

    <div class="btn-Filtrar dropstart">
        <button class="btn btn-danger dropdown-toggle" type="button" id="btn-filtrar" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Filtrar
        </button>
        <ul class="dropdown-menu p-2" aria-labelledby="btn-filtrar">
            
        <li>
            <button class="dropdown-item d-flex justify-content-between align-items-center"
                    type="button" data-bs-toggle="collapse" data-bs-target="#grupoEstado"
                    aria-expanded="true">
                Estado <span>▾</span>
            </button>

            <div class="collapse" id="grupoEstado">
                <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="ePrestada">Disponible</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="estado" value="Disponible" id="eDisponible">
                    </div>
                    <div class="form-check- ms-4 my-1">
                        <label class="form-check-label" for="ePrestada">Prestada</label>
                        <input class="form-check-input filtro" type="checkbox" data-campo="estado" value="Prestada" id="ePrestada">
                    </div>
                </div>
            </li>
        </ul>
    </div>

    <div class="buscador">
        <input type="text" id="buscador" class="form-control"
           placeholder="Buscar Laptop">
    </div>

    <div class="table-responsive">
        <table border="1">
            <thead>
                <tr>
                    <th>Laptop</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/tecnicoGestionarLaptops.js"></script>
</body>
</html>
