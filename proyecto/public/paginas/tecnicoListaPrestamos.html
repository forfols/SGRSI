<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/tecnico.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center">
            <a href="indexTecnico.html"><button class="btnNav">Volver</button></a>
            <button class="btnNav" id="btnCerrarSesion">Cerrar sesión</button>
        </nav>
    </header>

    <div id="alerta"></div>

    <h1>Lista de Préstamos</h1>

    <div class="buscador">
        <input type="text" id="buscador" class="form-control"
           placeholder="Buscar por Alumno, Cédula, Laptop, Técnico, Fecha... ">
    </div>

    <div class="table-responsive">
        <table border="1">
            <thead>
                <tr>
                    <th>Alumno</th>
                    <th>Cédula</th>
                    <th>Laptop</th>
                    <th>Técnico</th>
                    <th>Fecha préstamo</th>
                    <th>Fecha devolución</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <div>
        <ul class="pagination justify-content-center mt-3" id="paginador"></ul>
    </div>


    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/tecnicoListaPrestamos.js"></script>
</body>
</html>
