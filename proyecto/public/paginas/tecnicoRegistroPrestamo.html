<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar préstamo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/solicitante.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center">
            <a href="indexTecnico.html"><button class="btnNav">Volver</button></a>
            <button class="btnNav" id="btnCerrarSesion">Cerrar sesión</button>
        </nav>
    </header>

    <div id="alerta"></div>

    <form id="registroPrestamo" class="mt-3">
        <fieldset>
            <legend>Realizar préstamo</legend>

            <div class="mb-2">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre" required>
            </div>

            <div class="mb-2">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingrese el apellido" required>
            </div>

            <div class="mb-2">
                <label for="cedula">Cédula:</label>
                <input type="text" id="cedula" name="cedula" pattern="[1-9][0-9]{7}" title="Ingrese la cédula de 8 dígitos sin puntos ni guiones" inputmode="numeric" maxlength="8" placeholder="Ingrese la cédula" required>
            </div>

            <div class="mb-2">
                <label for="laptop">Laptop:</label>
                <select id="laptop" name="laptop" required>
                    <option value="" disabled selected hidden>--</option>
                </select>
            </div>

            <input type="submit" value="Prestar" class="mt-2">
        </fieldset>
    </form>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utilidades.js"></script>
    <script src="../assets/js/tecnicoRegistroPrestamo.js"></script>
</body>
</html>
